name: Eta Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release:
        description: '是否创建 GitHub Release（开发迭代留 false，正式发版填 true）'
        required: false
        type: boolean
        default: false
      release_notes:
        description: 'Release 说明（留空则仅写版本号）'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint 与单元测试
    if: github.event_name == 'push' || inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: Lint 与单元测试
        run: >-
          ./gradlew --no-daemon --no-configuration-cache --continue
          :app:lintDebug :app:testDebugUnitTest

      - name: 上传检查报告
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-apks:
    name: 构建 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version_name: ${{ steps.apk.outputs.version_name }}
      is_stable: ${{ steps.apk.outputs.is_stable }}

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 还原发布证书
        env:
          ETA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$ETA_RELEASE_KEYSTORE_BASE64" ||
                -z "$ETA_RELEASE_STORE_PASSWORD" ||
                -z "$ETA_RELEASE_KEY_ALIAS" ||
                -z "$ETA_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::缺少 Release 签名 Secrets，请检查仓库的 Actions Secrets。"
            exit 1
          fi
          printf '%s' "$ETA_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/eta-release.jks"

      - name: 构建 Release APK
        id: build
        env:
          ETA_RELEASE_STORE_FILE: ${{ runner.temp }}/eta-release.jks
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          metadata_arg=()
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            metadata_arg=("-Peta.buildMetadata=${GITHUB_SHA::7}")
          fi
          ./gradlew --no-daemon --no-configuration-cache "${metadata_arg[@]}" :app:assembleRelease

      - name: 验证并整理 APK
        id: apk
        run: |
          shopt -s nullglob
          release_apks=(app/build/outputs/apk/release/Eta-v*.apk)
          apksigner_path="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [[ ${#release_apks[@]} -ne 1 ]]; then
            echo "::error::Release APK 数量异常（${#release_apks[@]}）。"
            exit 1
          fi
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::未找到 apksigner。"
            exit 1
          fi

          "$apksigner_path" verify "${release_apks[0]}"

          metadata="app/build/outputs/apk/release/output-metadata.json"
          version_name="$(jq -r '.elements[0].versionName' "$metadata")"
          version_code="$(jq -r '.elements[0].versionCode' "$metadata")"

          if [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            is_stable=true
          else
            is_stable=false
          fi

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "is_stable=$is_stable" >> "$GITHUB_OUTPUT"
          echo "release_path=${release_apks[0]}" >> "$GITHUB_OUTPUT"
          echo "### 构建结果" >> "$GITHUB_STEP_SUMMARY"
          echo "- versionName: \`$version_name\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- versionCode: \`$version_code\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 正式版: \`$is_stable\`" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version_name" ]]; then
              echo "::error::标签 $GITHUB_REF_NAME 与 versionName $version_name 不一致。"
              exit 1
            fi
          fi

      - name: 上传 Release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.release_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: 发布正式版
    needs: [verify, build-apks]
    if: |
      always() &&
      needs.build-apks.result == 'success' &&
      needs.build-apks.outputs.is_stable == 'true' &&
      (github.ref_type == 'tag' || inputs.release)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 下载 Release APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Eta-v${{ needs.build-apks.outputs.version_name }}.apk
          path: ${{ runner.temp }}/release

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-apks.outputs.version_name }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          tag="v$VERSION"
          apk="$RUNNER_TEMP/release/Eta-$tag.apk"
          if [[ ! -f "$apk" ]]; then
            echo "::error::未找到 APK: $apk"
            ls -la "$RUNNER_TEMP/release"
            exit 1
          fi
          notes="${NOTES:-Eta $VERSION}"
          gh release create "$tag" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes "$notes" \
            --latest
